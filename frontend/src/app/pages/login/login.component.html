<div class="auth-box">
  <h2>Iniciar sesión</h2>
  <input type="email" placeholder="Correo" [(ngModel)]="correo">
  <input type="password" placeholder="Contraseña" [(ngModel)]="contrasena">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <button (click)="ingresar()">Entrar</button>
  <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</div>
